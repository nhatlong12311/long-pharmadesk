services:
  - type: web
    name: long-pharmadesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PHARMADESK_ONLINE
        value: "1"
      - key: PHARMADESK_USERNAME
        value: clinical
      - key: PHARMADESK_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.9
