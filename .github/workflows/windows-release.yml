name: Build PharmaDesk for Windows

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to publish from main, for example v3.0.1'
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Test PharmaDesk with synthetic data
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Build the portable app
        shell: cmd
        run: call Build_exe.bat
      - name: Start the packaged app
        run: |
          $package = Resolve-Path 'dist/PharmaDesk_V3_0'
          $app = Start-Process -FilePath "$package/PharmaDesk_V3_0.exe" -WorkingDirectory $package -PassThru
          try {
            $tools = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $tools = Invoke-WebRequest 'http://127.0.0.1:5173/' -TimeoutSec 2
                break
              } catch {
                if ($app.HasExited) { throw }
                Start-Sleep -Seconds 1
              }
            }
            if ($tools.Content -notmatch "sessionToken='([^']+)'") { throw 'Tools did not start' }
            $token = $Matches[1]
            $result = Invoke-RestMethod 'http://127.0.0.1:5173/api/test/compare' -Method Post -Headers @{'X-PharmaDesk-Token' = $token}
            if ($result.ok -ne $false -or $result.msg -notlike '*file*') {
              throw 'The packaged Trừ tổng module did not respond'
            }
          } catch {
            $log = Join-Path $package 'Logs/PhanMemBoiHoan.log'
            if (Test-Path $log) { Get-Content $log -Tail 30 }
            throw
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            $app.WaitForExit()
          }
          if (-not (Test-Path (Join-Path $package 'Mau tong.xlsx'))) { throw 'Missing requisition template' }
      - name: Archive the portable app
        run: Compress-Archive -Path 'dist/PharmaDesk_V3_0' -DestinationPath 'PharmaDesk_V3_0_Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: PharmaDesk_Windows
          path: PharmaDesk_V3_0_Windows.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PharmaDesk_Windows
      - name: Publish the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "PharmaDesk $RELEASE_TAG" --generate-notes PharmaDesk_V3_0_Windows.zip
