name: PharmaDesk GitHub Pages

on:
  push:
    branches: [main]
    paths: &pages_paths
      - "web/**"
      - "ui/index.html"
      - "docs/**"
      - "ABC_VEN/**"
      - "ADR/**"
      - "TUONG_TAC/**"
      - "abcven.py"
      - "adr.py"
      - "common.py"
      - "tdm.py"
      - "ttt.py"
      - ".github/workflows/check-pages.yml"
  pull_request:
    paths: *pages_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python web/build.py dist-pages
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: node web/smoke.cjs dist-pages
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
