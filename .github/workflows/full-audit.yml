name: Full PharmaDesk module audit

on:
  pull_request:
    paths:
      - "tests/test_full_smoke.py"
      - ".github/workflows/full-audit.yml"
      - "app.py"
      - "abcven.py"
      - "ttt.py"
      - "tdm.py"
      - "adr.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install original Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate backend syntax
        run: python -m compileall -q app.py abcven.py ttt.py tdm.py adr.py common.py tests
      - name: Test all PharmaDesk modules with synthetic data
        run: python -m unittest discover -s tests -p test_full_smoke.py -v
