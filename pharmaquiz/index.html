<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PharmaQuiz</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f3;color:#193b38;font:16px system-ui,Arial,sans-serif}main{max-width:800px;margin:auto;padding:24px 16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{margin:0;font-size:30px;letter-spacing:-1px}small{color:#57736e}section{background:white;border:1px solid #dce9e5;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 6px 24px #183e3010}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}.stats strong{display:block;font-size:29px}.bar{height:8px;background:#e7efed;border-radius:20px;overflow:hidden;margin:18px 0 8px}.bar div{height:100%;background:#168575;transition:width .2s}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,select{font:inherit;border-radius:11px;padding:12px 15px;border:1px solid #bcd2cd;background:white;color:#193b38;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}.primary{background:#116f61;color:white;border-color:#116f61}.again{background:#fff2df;color:#8a4d14;border-color:#efd3ab}.actions{display:flex;gap:10px}.actions button{flex:1;min-height:52px;font-weight:650}#card{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center}#question{font-size:clamp(22px,4vw,30px);line-height:1.4;margin:24px 0}#answer{border-top:1px solid #e0eae7;padding-top:18px}#answer strong{font-size:24px;color:#116f61}#explain{line-height:1.6}footer{font-size:12px;color:#57736e;line-height:1.6}#status{font-size:13px;color:#57736e;margin:8px 0}select{max-width:100%}.ghost{font-size:13px;padding:8px 10px}button:focus-visible,select:focus-visible{outline:3px solid #83cbbd} @media(max-width:450px){main{padding:16px 10px}section{padding:16px}.tools select{width:100%}}
</style><main><header><div><small>OLYMPIA · VÒNG KHỞI ĐỘNG</small><h1>PharmaQuiz</h1><small>Ôn thi dược sĩ giỏi</small></div><button class="ghost" id="backup">Sao lưu</button></header><section><div class="stats"><div><strong id="learned">0</strong><small>Đã thuộc</small></div><div><strong id="left">0</strong><small>Chưa thuộc</small></div><div><strong id="hardCount">0</strong><small>Câu khó còn lại</small></div></div><div class="bar"><div id="progress"></div></div><small id="progressText"></small></section><div class="tools"><select id="topic" aria-label="Chuyên đề"><option value="">Tất cả chuyên đề</option></select><select id="mode" aria-label="Chế độ"><option value="all">Học câu chưa thuộc</option><option value="hard">Ôn câu khó</option></select><button id="shuffle">Trộn câu</button><button id="reset" class="ghost">Học lại</button></div><section id="card"><small id="meta">Đang tải câu hỏi…</small><h2 id="question"></h2><div id="answer" hidden><strong id="answerText"></strong><p id="explain"></p></div></section><div class="actions"><button id="reveal" class="primary">Xem đáp án</button><button id="again" class="again" hidden>Chưa thuộc ↻</button><button id="know" class="primary" hidden>Đã thuộc ✓</button></div><div id="status" role="status"></div><footer>Phím tắt: Space xem đáp án · 1 chưa thuộc · 2 đã thuộc. Tiến độ lưu trên trình duyệt này. Tài liệu ôn tập, không thay thế phác đồ điều trị. <button id="restore" class="ghost">Khôi phục sao lưu</button><input type="file" id="file" accept=".json" hidden></footer></main><script>
const $=id=>document.getElementById(id),KEY='pharmaquiz-progress-v1';let bank=[],map=new Map(),known=new Set(),hard=new Set(),queue=[],shown=false,topic='',mode='all',storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify({known:[...known],hard:[...hard],queue,topic,mode}));storageOK=true}catch(e){storageOK=false}}
function eligible(x){return !known.has(x.id)&&(!topic||x.topic===topic)&&(mode!=='hard'||hard.has(x.id))}
function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reconcile(random=false){let ids=bank.filter(eligible).map(x=>x.id),allowed=new Set(ids);queue=[...new Set(queue.filter(x=>allowed.has(x)))];let seen=new Set(queue);queue.push(...ids.filter(x=>!seen.has(x)));if(random)mix(queue);shown=false;render()}
function render(){save();let x=map.get(queue[0]);$('learned').textContent=known.size;$('left').textContent=bank.length-known.size;$('hardCount').textContent=[...hard].filter(id=>!known.has(id)).length;let percent=bank.length?100*known.size/bank.length:0;$('progress').style.width=percent+'%';$('progressText').textContent=known.size+'/'+bank.length+' câu · '+percent.toFixed(1)+'%';$('meta').textContent=x?'CÂU '+x.id+' · '+x.topic+' · '+queue.length+' câu trong lượt':'HOÀN THÀNH LƯỢT';$('question').textContent=x?x.q:'Không còn câu nào trong nhóm này';$('answer').hidden=!x||!shown;$('answerText').textContent=x?.a||'';$('explain').textContent=x?.e||'';$('reveal').hidden=!x||shown;$('again').hidden=!x||!shown;$('know').hidden=!x||!shown;$('status').textContent=storageOK?'Tiến độ đã lưu trên thiết bị.':'Không lưu được tiến độ. Hãy sao lưu trước khi đóng trang.'}
function rate(ok){if(!shown||!queue.length)return;let id=queue.shift();if(ok){known.add(id)}else{hard.add(id);let gap=5+Math.floor(Math.random()*6);queue.splice(Math.min(gap,queue.length),0,id)}shown=false;render()}
function load(s){let valid=a=>Array.isArray(a)?a.filter(x=>map.has(x)):[];known=new Set(valid(s.known));hard=new Set(valid(s.hard));queue=valid(s.queue);topic=bank.some(x=>x.topic===s.topic)?s.topic:'';mode=s.mode==='hard'?'hard':'all';$('topic').value=topic;$('mode').value=mode;reconcile()}
$('reveal').onclick=()=>{shown=true;render()};$('know').onclick=()=>rate(true);$('again').onclick=()=>rate(false);$('topic').onchange=e=>{topic=e.target.value;reconcile()};$('mode').onchange=e=>{mode=e.target.value;reconcile()};$('shuffle').onclick=()=>reconcile(true);$('reset').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ học trên thiết bị này?')){known.clear();hard.clear();queue=[];mode='all';$('mode').value=mode;reconcile(true)}};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({known:[...known],hard:[...hard],queue,topic,mode})],{type:'application/json'}));a.download='pharmaquiz-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.known)||!Array.isArray(s.hard))throw Error();if(confirm('Thay thế tiến độ hiện tại bằng bản sao lưu?'))load(s)}catch{alert('File sao lưu không hợp lệ')}e.target.value=''};document.addEventListener('keydown',e=>{if(e.repeat||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'&&!shown&&queue.length){e.preventDefault();shown=true;render()}else if(e.key==='1')rate(false);else if(e.key==='2')rate(true)});
fetch('./questions.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(b=>{bank=b;map=new Map(b.map(x=>[x.id,x]));for(let t of [...new Set(b.map(x=>x.topic))]){let o=document.createElement('option');o.value=o.textContent=t;$('topic').append(o)}let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}load(s)}).catch(e=>{$('meta').textContent='Không tải được ngân hàng câu hỏi';$('question').textContent='Hãy tải lại trang.';$('reveal').disabled=true;$('status').textContent=String(e)});
</script></html>
